[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agentops"
version = "0.1.0"
description = "Operating a tool-calling LLM agent like a production service: golden set on real Open-Meteo data, guarded executor, non-regression gate for model upgrades, and fallback / degraded-mode continuity measured under injected failures."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
llm = ["torch>=2.2", "transformers>=4.45", "accelerate>=0.30"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
agentops = "agentops.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentops"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
